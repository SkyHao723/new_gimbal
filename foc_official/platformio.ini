; ============================================================================
; PlatformIO 工程 —— STM32F103C8T6(蓝板) + SimpleFOC Mini(DRV8316C) + AS5600
;
; 使用【官方 SimpleFOC 库】(askuric/Simple FOC 2.4.0)
; 官方库原生支持 STM32F1，且自带蓝板专用示例：
;   examples/hardware_specific_examples/Bluepill_examples/
;
; ---------------------------------------------------------------------------
; 引脚映射（与实物接线一致）
;   PWM1/2/3 : PA8 / PA9 / PA10     TIM1_CH1/2/3  -> 驱动板 IN1/IN2/IN3
;   EN       : PB0                                -> 驱动板 EN
;   串口     : PA2(TX) / PA3(RX)    USART2        115200 8N1
;   编码器   : PB6(SCL) / PB7(SDA)  I2C1, AS5600 @0x36
;   SWD      : PA13 / PA14
;   LED      : PC13
; ---------------------------------------------------------------------------
; ★ 关键坑（务必保留下面的 build_flags）
;
;   1) Arduino STM32 core 的串口命名与直觉不同：
;        Uart Serial1(USART1);   <- Serial1 是 USART1 (PA9/PA10，已被 PWM 占用！)
;        Uart Serial2(USART2);   <- Serial2 才是 USART2 (PA2/PA3)
;      所以必须用 Serial2，且必须定义 HAVE_HWSERIAL2 才会被编译出来。
;      用错 Serial1 会导致串口收发不可靠（实测约一半命令丢失）。
;
;   2) 只定义 Serial2，不要定义 HAVE_HWSERIAL1，
;      否则 Serial1 会去抢 PA9/PA10（PWM 引脚）。
;
;   3) Serial2 的引脚需要通过 PIN_SERIAL2_TX / PIN_SERIAL2_RX 指定，
;      因为 variant_PILL_F103Cx.h 里只定义了 Serial(USART1) 的引脚。
; ---------------------------------------------------------------------------

[env:bluepill]
platform = ststm32
board = bluepill_f103c8
framework = arduino

; 官方 SimpleFOC 库
lib_deps =
    askuric/Simple FOC@ ^2.4.0

monitor_speed = 115200
upload_protocol = stlink

; F103C8 只有 64KB Flash / 20KB RAM（实测占用约 84% Flash，注意体积）
build_flags =
    -O2
    -ffunction-sections
    -fdata-sections
    -Wall
    ; ---- 串口：启用 Serial2 = USART2 (PA2/PA3) ----
    -D HAVE_HWSERIAL2
    -D PIN_SERIAL2_TX=PA2
    -D PIN_SERIAL2_RX=PA3

; 编译前自动修补 SimpleFOC 与新版 Arduino STM32 core 的兼容问题
; （enableTimerClock 参数类型不匹配，详见 patch_simplefoc.py）
extra_scripts = pre:patch_simplefoc.py
