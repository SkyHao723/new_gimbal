; ============================================================================
; PlatformIO 工程 —— STM32F103C8T6(蓝板) + SimpleFOC Mini(DRV8316C) + AS5600
;
; 使用【官方 SimpleFOC 库】(askuric/Simple FOC)，不是厂家 2019 年的移植版。
; 官方库原生支持 STM32F1（含 PWM 驱动与电流采样）。
;
; 引脚映射（与实物接线一致）：
;   PWM1/2/3 = PA8/PA9/PA10   (TIM1_CH1/2/3)
;   EN       = PB0
;   串口     = PA2/PA3        (USART2)
;   I2C      = PB6(SCL)/PB7(SDA)   接 AS5600
;   SWD      = PA13/PA14
;
; 烧录：ST-Link    pio run -t upload
; ============================================================================

[env:bluepill]
platform = ststm32
board = bluepill_f103c8
framework = arduino

; 官方 SimpleFOC 库
lib_deps =
    askuric/Simple FOC@ ^2.4.0

monitor_speed = 115200
upload_protocol = stlink

; F103C8 只有 64KB Flash / 20KB RAM，注意控制体积
build_flags =
    -O2
    -ffunction-sections
    -fdata-sections
    -Wall

; 编译前自动修补 SimpleFOC 与新版 Arduino STM32 core 的不兼容
; （enableTimerClock 参数类型不匹配，详见 patch_simplefoc.py）
extra_scripts = pre:patch_simplefoc.py
